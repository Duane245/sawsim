name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for headless Gmsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libopengl0 libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install
        run: pip install -e ".[dev]"
      - name: 2D templates and API
        run: pytest -q
      - name: Hex27 templates (2.5D)
        if: matrix.python == '3.11'
        run: SAWSIM_TEST_ALL=1 pytest -q tests/test_templates.py -k 2p5d
